apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: primevideo-ingress
  namespace: primevideo
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP" # <--- Ensure this is HTTP, NOT HTTPS
  labels:
    app.kubernetes.io/name: primevideo-ingress
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - app.rishindra.shop
    secretName: app-tls-secret
  rules:
  - host: app.rishindra.shop
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: primevideo-service
            port: 
              number: 3000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: primevideo-clone-deployment
spec:
  selector:
    matchLabels:
      app: primevideo-clone
  template:
    metadata:
      labels:
        app: primevideo-clone
    spec:
      imagePullSecrets:
        - name: artifact-registry-secret
      containers:
        - name: primevideo-clone
          image: poc-repo/primevideo-clone-app:2
          ports:
            - containerPort: 3000